services:
  postgres:
    image: postgres:16
    container_name: crud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crud_user
      POSTGRES_PASSWORD: crud123
      POSTGRES_DB: crud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
